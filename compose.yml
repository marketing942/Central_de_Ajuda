services:
  web:
    # Ajuste para a imagem publicada pelo CI (mesmo fluxo do site-cppem), ou
    # troque por `build: .` para buildar na máquina.
    image: ghcr.io/cppemsistemas/central-de-ajuda:latest

    ports:
      - "3000:3000"
    # ⚠️ Só chega ao processo o que estiver LISTADO aqui. Variável nova no
    # código → adicionar em .env.example e aqui.
    environment:
      NEXT_PUBLIC_SITE_URL:      ${NEXT_PUBLIC_SITE_URL}
      CPPEM_SITE_URL:            ${CPPEM_SITE_URL}
      NOTION_TOKEN:              ${NOTION_TOKEN}
      NOTION_AJUDA_DATABASE_ID:  ${NOTION_AJUDA_DATABASE_ID}
      REVALIDATE_SECRET:         ${REVALIDATE_SECRET}
      SUPORTE_EMAIL:             ${SUPORTE_EMAIL}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 96M
